name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, publish to Docker Hub and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: docker build -t frontend-local ./frontend

      - name: Build backend image
        run: docker build -t backend-local ./backend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag images with v1 and latest
        run: |
          docker tag frontend-local "$DOCKERHUB_USERNAME/frontend:v1"
          docker tag frontend-local "$DOCKERHUB_USERNAME/frontend:latest"
          docker tag backend-local "$DOCKERHUB_USERNAME/backend:v1"
          docker tag backend-local "$DOCKERHUB_USERNAME/backend:latest"

      - name: Push all image tags to Docker Hub
        run: |
          docker push "$DOCKERHUB_USERNAME/frontend:v1"
          docker push "$DOCKERHUB_USERNAME/frontend:latest"
          docker push "$DOCKERHUB_USERNAME/backend:v1"
          docker push "$DOCKERHUB_USERNAME/backend:latest"

      - name: Create deployment environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "PORT=3000"
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
          } > .env

      - name: Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using docker-compose.deploy.yml
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify application and services
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null && echo "Frontend is responding"
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml exec -T redis redis-cli ping
          docker compose -f docker-compose.deploy.yml exec -T postgres pg_isready -U taskflow_user -d taskflow

      - name: Run API tests against Docker Hub deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Frontend: \`$DOCKERHUB_USERNAME/frontend:v1\`, \`:latest\`"
            echo "- Backend: \`$DOCKERHUB_USERNAME/backend:v1\`, \`:latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
